[package]
name = "jwt"
version = "0.6.0"
alya-version = "0.0.18"
entry = "src/lib.alya"
description = "JSON Web Token (RFC 7519) library for Alya backed by alya-lang/crypto"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
