name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Alya Compiler
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Verify alyac installation
        run: |
          alyac --version

      - name: Check code formatting
        run: |
          alyac fmt . --check

      - name: Check package manifest
        run: |
          alyac pkg list

      - name: Install dependencies
        run: |
          alyac install

      - name: Install gdb on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdb

      - name: Run package test suite
        run: |
          alyac test || {
            if [ "$RUNNER_OS" = "Linux" ]; then
              alyac build tests/test_basic.alya -o test_bin
              gdb -batch -ex "run" -ex "bt 25" ./test_bin
            fi
            exit 1
          }

